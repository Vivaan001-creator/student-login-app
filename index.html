<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Student Desk</title>
<style>
  /* This page is the Android app's entry point — NOT a website
     homepage. It shows the brand for a moment (matching the
     native splash screen configured in capacitor.config.json)
     and then sends the person to the right place:
       - already logged in (any role) -> straight to that
         role's dashboard, no login screen shown again
       - not logged in -> the role-picker login screen
     There is no "website home" inside the app anymore. */
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background:#0e1326;
    display:flex; align-items:center; justify-content:center;
    font-family:'Segoe UI', Arial, sans-serif;
    overflow:hidden;
  }
  .splash-logo{
    width:132px; height:132px; border-radius:32px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
    animation:logoIn .7s cubic-bezier(.16,.84,.44,1) both;
  }
  @keyframes logoIn{
    0%{ opacity:0; transform:scale(.72); }
    60%{ opacity:1; transform:scale(1.06); }
    100%{ opacity:1; transform:scale(1); }
  }
  .splash-name{
    position:fixed; bottom:14%; left:0; right:0; text-align:center;
    color:#f3ecd9; font-size:13px; letter-spacing:2px; text-transform:uppercase; font-weight:600;
    opacity:0; animation:fadeIn .6s .35s ease both;
  }
  @keyframes fadeIn{ to{ opacity:.75; } }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; } .splash-name{ opacity:.75; } }
</style>
</head>
<body>

  <img class="splash-logo" src="logo.png" alt="Student Desk">
  <div class="splash-name">Student Desk</div>

  <script>
    function routeToApp() {
      var dest = 'login.html';
      if (localStorage.getItem('adminLoggedIn') === 'true') dest = 'dashboard.html';
      else if (localStorage.getItem('teacherLoggedIn') === 'true') dest = 'teacher-dashboard.html';
      else if (localStorage.getItem('studentLoggedIn') === 'true') dest = 'student-dashboard.html';
      else if (localStorage.getItem('parentLoggedIn') === 'true') dest = 'parent-dashboard.html';
      window.location.replace(dest);
    }
    // Give the entrance animation a moment to actually be seen —
    // this is the "icon with animation" moment on every app open.
    setTimeout(routeToApp, 900);
  </script>

</body>
</html>
